name: Sync & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Abhängigkeiten
        working-directory: tools
        run: npm ci

      - name: Tests
        working-directory: tools
        run: npm test

      - name: Instagram, YouTube & manuelle Bilder holen
        working-directory: tools
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
        run: node sync.mjs

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data media
          if git diff --cached --quiet; then
            echo "Keine neuen Inhalte."
          else
            git commit -m "chore: sync media"
            git push
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          for p in index.html scripts.html datenschutz.html css js vendor assets data media; do
            if [ -e "$p" ]; then cp -r "$p" _site/; fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
